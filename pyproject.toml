[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-video"
version = "0.1.0"
description = "Measure temporal drift (semantic, colour flicker, face identity, motion) in AI-generated videos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "opencv-python-headless", "matplotlib"]

[project.optional-dependencies]
clip = ["torch", "open_clip_torch", "pillow"]
dev = ["pytest"]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
